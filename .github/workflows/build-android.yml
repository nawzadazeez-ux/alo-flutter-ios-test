name: Build Alo Solar Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Repair/generate Android platform files
        run: flutter create . --platforms=android --org com.alosolarenergy
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze || true
      - name: Build APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alo-Solar-Energy-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
