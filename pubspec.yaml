name: alo_solar_v10_native
description: Alo Solar Energy V17 native app with persistent dealer sessions, installer verification and self-registration.
publish_to: "none"
version: 5.0.0+17

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.3.0
  url_launcher: ^6.3.1
  flutter_pdfview: ^1.4.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/alo_logo.png
