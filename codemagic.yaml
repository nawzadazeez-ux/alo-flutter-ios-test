workflows:
  alo-ios-simulator:
    name: Alo Solar Energy - iPhone Simulator
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create clean iOS platform files
        script: |
          rm -rf ios
          flutter create --platforms=ios .
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Prepare CocoaPods dependencies
        script: |
          if [ -f ios/Podfile ]; then
            cd ios
            pod install
          else
            echo "No Podfile found. Flutter project has no iOS CocoaPods dependencies to install."
          fi
      - name: Build iOS Simulator app
        script: |
          flutter build ios --simulator --debug
      - name: Package simulator build
        script: |
          cd build/ios/iphonesimulator
          if [ -d Runner.app ]; then
            ditto -c -k --sequesterRsrc --keepParent Runner.app AloSolar-iOS-Simulator.zip
          fi
    artifacts:
      - build/ios/iphonesimulator/*.app
      - build/ios/iphonesimulator/AloSolar-iOS-Simulator.zip
      - /tmp/xcodebuild_logs/*.log
